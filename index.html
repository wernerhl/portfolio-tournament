<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Tournament</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>♛</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070a; --c1:rgba(255,255,255,0.02); --c2:rgba(255,255,255,0.04);
  --bd:rgba(255,255,255,0.05); --bd2:rgba(255,255,255,0.10);
  --t1:#d4d4d4; --t2:#a3a3a3; --t3:#737373; --t4:#525252; --t5:#333;
  --g:#4ade80; --y:#facc15; --r:#f87171; --b:#60a5fa; --p:#a78bfa; --o:#fb923c;
  --tier1:#3266ad; --tier2:#1D9E75; --tier3:#BA7517; --tier4:#D85A30; --tier5:#a78bfa;
  --m:'IBM Plex Mono','SF Mono',monospace; --s:'Inter',-apple-system,sans-serif;
}
body{background:var(--bg);color:var(--t1);font-family:var(--s);min-height:100vh;line-height:1.4}
.w{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
button{cursor:pointer;font-family:var(--m);background:0;border:0;color:inherit}
code{font-family:var(--m);color:var(--t2)}

/* Header */
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:18px;flex-wrap:wrap}
.hd-l h1{font:700 13px var(--m);color:var(--t2);letter-spacing:.08em}
.hd-dot{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 8px rgba(74,222,128,.5);display:inline-block;margin-right:8px}
.hd-sub{font:400 10px var(--m);color:var(--t4);margin-top:3px}
.regime{display:flex;gap:10px;align-items:center;padding:6px 14px;border:1px solid var(--bd2);border-radius:6px;background:var(--c1)}
.regime-num{font:700 22px var(--m);letter-spacing:-.03em}
.regime-lbl{font:600 8.5px var(--m);letter-spacing:.15em;line-height:1.2}
.regime-meta{font:400 8.5px var(--m);color:var(--t4);line-height:1.4}

/* Leader banner */
.lb{margin-bottom:16px;padding:12px 16px;background:linear-gradient(90deg,rgba(255,215,0,.06),rgba(255,255,255,.01));border:1px solid rgba(255,215,0,.15);border-radius:8px;display:flex;align-items:center;gap:14px;font:500 11px var(--s)}
.lb-crown{font-size:22px}
.lb-name{font:700 13px var(--s);color:var(--t1)}
.lb-stat{font:400 11px var(--m);color:var(--t3)}
.lb-stat strong{color:var(--g);font-weight:700}

/* Chart */
.chart-card{background:var(--c1);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:18px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chart-title{font:700 10px var(--m);color:var(--t3);letter-spacing:.15em}
.periods{display:flex;gap:2px}
.period-btn{padding:4px 10px;font:600 9px var(--m);letter-spacing:.08em;color:var(--t3);border-radius:3px;border:1px solid transparent;transition:all .12s}
.period-btn:hover{color:var(--t2)}
.period-btn.on{background:rgba(255,255,255,.05);color:var(--t1);border-color:rgba(255,255,255,.08)}
.chart-wrap{position:relative;height:360px}
.chart-meta{font:400 9px var(--m);color:var(--t4);margin-top:6px;text-align:right}

/* Leaderboard */
.lbtable{margin-bottom:18px;background:var(--c1);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.lb-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lb-h h2{font:700 10px var(--m);color:var(--t3);letter-spacing:.15em}
.lb-h-sub{font:400 9px var(--m);color:var(--t5)}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--m)}
th{font:600 8.5px var(--m);color:var(--t4);letter-spacing:.12em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.02);white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.tier-row{cursor:pointer;transition:background .12s}
tr.tier-row:hover{background:rgba(255,255,255,.025)}
tr.tier-row.open td{background:rgba(255,255,255,.025)}
.rank{font:700 13px var(--m);color:var(--t4);width:24px}
.rank.first{color:var(--y)}
.tier-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:middle}
.tier-name{font:700 12px var(--s);color:var(--t1)}
.tier-desc{font:400 9px var(--m);color:var(--t5);margin-top:2px}
.pos{color:var(--g)}.neg{color:var(--r)}.neut{color:var(--t3)}
.chev{display:inline-block;color:var(--t4);transition:transform .15s}
.chev.open{transform:rotate(90deg)}

/* Tier expansion */
.tier-detail{display:none;padding:14px 16px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--bd)}
.tier-detail.open{display:block}
.td-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:10px}
.td-block{background:var(--c1);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.td-label{font:600 8px var(--m);color:var(--t4);letter-spacing:.18em;margin-bottom:4px}
.td-val{font:700 18px var(--m);letter-spacing:-.02em}
.td-sub{font:400 9px var(--m);color:var(--t4);margin-top:2px}
.h-table{margin-top:8px;width:100%;border-collapse:collapse;font-size:10.5px}
.h-table th{padding:5px 6px;font-size:8px}
.h-table td{padding:5px 6px}
.h-table tr.tk-row{cursor:pointer}
.h-table tr.tk-row:hover td{background:rgba(255,255,255,.03)}
.gauge{display:flex;height:6px;border-radius:3px;background:var(--c2);overflow:hidden}
.gauge .eq{background:var(--b)}
.gauge .csh{background:var(--t3)}
.hedge{font:400 10px var(--s);color:var(--t2);padding:6px 10px;background:var(--c1);border-left:2px solid var(--p);border-radius:0 4px 4px 0;margin-top:6px}
.hedge .k{font:700 8px var(--m);color:var(--p);letter-spacing:.12em;margin-right:6px}

/* Ticker drill-down panel */
.tk-detail{margin:8px 0 12px 0;padding:14px;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:8px}
.tk-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:14px}
.tk-title h3{font:700 18px var(--s);color:var(--t1);line-height:1.2}
.tk-title .sub{font:400 10px var(--m);color:var(--t4);margin-top:2px}
.tk-close{font:600 9px var(--m);color:var(--t3);padding:4px 9px;border:1px solid var(--bd);border-radius:3px}
.tk-close:hover{color:var(--t1);border-color:var(--bd2)}
.tk-tiers{font:600 8px var(--m);color:var(--t3);letter-spacing:.1em;margin-top:4px}

.tk-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:12px}
.tk-chart-wrap{position:relative;height:230px;background:rgba(0,0,0,.2);border:1px solid var(--bd);border-radius:6px;padding:8px}
.tk-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--c1);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
.stat .k{font:600 7.5px var(--m);color:var(--t4);letter-spacing:.18em}
.stat .v{font:700 14px var(--m);letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:10px;color:var(--t4);font-weight:500;margin-left:3px}
.tk-rets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.ret-card{background:rgba(0,0,0,.2);border:1px solid var(--bd);border-radius:4px;padding:6px;text-align:center}
.ret-card .k{font:600 7px var(--m);color:var(--t4);letter-spacing:.15em}
.ret-card .v{font:700 11px var(--m);margin-top:2px}

.tk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fund-card{background:var(--c1);border:1px solid var(--bd);border-radius:4px;padding:6px 8px}
.fund-card .k{font:600 7px var(--m);color:var(--t4);letter-spacing:.15em}
.fund-card .v{font:700 12px var(--m);margin-top:2px}

.score-bars{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.sb{display:flex;align-items:center;gap:8px;font:500 9.5px var(--m)}
.sb-lbl{flex:0 0 110px;color:var(--t3)}
.sb-bar{flex:1;height:5px;background:var(--c2);border-radius:2px;position:relative;overflow:hidden}
.sb-bar .fill{height:100%;border-radius:2px}
.sb-val{flex:0 0 36px;text-align:right;color:var(--t2);font-weight:700}

.corr-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.corr-card{background:var(--c1);border:1px solid var(--bd);border-radius:4px;padding:6px}
.corr-card .tk{font:700 10px var(--m);color:var(--t2)}
.corr-card .v{font:700 12px var(--m);margin-top:2px}

/* === REGIME COMMAND CENTER === */
.rcc{margin-bottom:22px;display:flex;flex-direction:column;gap:14px}
.rcc-top{display:grid;grid-template-columns:280px 1fr;gap:14px}
.rcc-card{background:var(--c1);border:1px solid var(--bd);border-radius:8px;padding:14px}
.rcc-card h3{font:700 9.5px var(--m);color:var(--t3);letter-spacing:.18em;margin-bottom:10px}

/* Cycle position gauge */
.gauge-svg{display:block;margin:6px auto 0;width:100%;max-width:230px;height:auto}
.gauge-rt{font:700 14px var(--m);text-align:center;letter-spacing:.05em;color:var(--t1);margin-top:2px}
.gauge-rt .r-num{font-size:18px}
.gauge-lbl{font:700 11px var(--s);text-align:center;letter-spacing:.04em;margin-top:6px}
.verdict{font:500 11px var(--s);color:var(--t2);line-height:1.55;margin-top:12px;
         padding-top:10px;border-top:1px dashed var(--bd2)}

/* Tier section heading inside the indicator card */
.ind-tier-head{display:flex;align-items:baseline;justify-content:space-between;
               font:600 8.5px var(--m);letter-spacing:.18em;color:var(--t4);
               padding:8px 4px 6px;border-bottom:1px dashed var(--bd);margin-bottom:6px}
.ind-tier-head .desc{font:400 9.5px var(--s);color:var(--t5);letter-spacing:0;text-transform:none}
.ind-tier-head:first-child{padding-top:0}
.tier-pill{display:inline-block;padding:1px 6px;border-radius:3px;font:700 7.5px var(--m);
           letter-spacing:.1em;margin-right:6px}
.tier-pill.A{background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.25)}
.tier-pill.B{background:rgba(96,165,250,0.12);color:#60a5fa;border:1px solid rgba(96,165,250,0.25)}
.tier-pill.C{background:rgba(115,115,115,0.18);color:#a3a3a3;border:1px solid rgba(115,115,115,0.30)}

/* Three-score header on the gauge card */
.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.score-cell{background:rgba(255,255,255,0.015);border:1px solid var(--bd);border-radius:5px;padding:6px 8px;text-align:center}
.score-cell .k{font:600 7.5px var(--m);color:var(--t4);letter-spacing:.16em}
.score-cell .v{font:700 16px var(--m);letter-spacing:-.02em;margin-top:1px}
.score-cell .s{font:600 8.5px var(--m);margin-top:0px}

/* Indicator cards */
.ind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ind-card{background:rgba(255,255,255,0.015);border:1px solid var(--bd);border-radius:6px;padding:9px 11px;
          transition:border-color .15s;cursor:pointer;position:relative}
.ind-card:hover{border-color:var(--bd2)}
.ind-card.expanded{border-color:var(--bd2);box-shadow:inset 0 0 0 1px rgba(96,165,250,0.25)}

/* Indicator detail panel */
.ind-detail{margin-top:14px;padding:14px;background:rgba(0,0,0,.30);border:1px solid var(--bd2);
            border-radius:8px;animation:fadeIn 0.15s ease-in}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ind-detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:14px}
.ind-detail-title h3{font:700 16px var(--s);color:var(--t1);line-height:1.2}
.ind-detail-title .sub{font:400 10px var(--m);color:var(--t4);margin-top:2px;letter-spacing:.06em}
.ind-detail-desc{font:400 11px var(--s);color:var(--t2);line-height:1.55;margin-top:6px}
.ind-detail-close{font:600 9px var(--m);color:var(--t3);padding:4px 9px;border:1px solid var(--bd);border-radius:3px;
                  cursor:pointer;background:transparent}
.ind-detail-close:hover{color:var(--t1);border-color:var(--bd2)}

.id-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.id-chart-wrap{position:relative;background:rgba(0,0,0,.18);border:1px solid var(--bd);border-radius:6px;padding:8px 8px 4px}
.id-chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 2px}
.id-chart-title{font:600 8px var(--m);color:var(--t4);letter-spacing:.18em}
.id-chart-canvas{position:relative;height:200px}
.id-periods{display:flex;gap:2px}
.id-period-btn{padding:3px 9px;font:600 9px var(--m);letter-spacing:.08em;color:var(--t4);
               border-radius:3px;border:1px solid transparent;cursor:pointer;background:transparent}
.id-period-btn:hover{color:var(--t2)}
.id-period-btn.on{background:rgba(255,255,255,.05);color:var(--t1);border-color:rgba(255,255,255,.08)}

.id-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.id-stat-block{background:rgba(0,0,0,.18);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.id-stat-block .head{font:600 8px var(--m);color:var(--t4);letter-spacing:.18em;margin-bottom:7px}
.id-stat-row{display:flex;justify-content:space-between;font:500 11px var(--m);padding:3px 0;color:var(--t2)}
.id-stat-row .k{color:var(--t4)}
.id-stat-row .v{color:var(--t1);font-weight:700;font-variant-numeric:tabular-nums}
.id-interp{margin-top:10px;padding:10px 12px;background:var(--c1);border-left:2px solid var(--b);
           border-radius:0 4px 4px 0;font:400 11px var(--s);color:var(--t2);line-height:1.55}
.id-interp .k{font:700 8px var(--m);color:var(--b);letter-spacing:.18em;margin-right:8px}
.ind-card.safe{background:rgba(74,222,128,0.04);border-color:rgba(74,222,128,0.15)}
.ind-card.neutral{background:rgba(96,165,250,0.04);border-color:rgba(96,165,250,0.15)}
.ind-card.elevated{background:rgba(250,204,21,0.05);border-color:rgba(250,204,21,0.18)}
.ind-card.crisis{background:rgba(248,113,113,0.05);border-color:rgba(248,113,113,0.22)}
.ind-lbl{font:600 9px var(--m);letter-spacing:.1em}
.ind-val{font:700 18px var(--m);letter-spacing:-.02em;margin-top:2px;color:var(--t1)}
.ind-narr{font:400 9.5px var(--s);color:var(--t3);margin-top:3px;min-height:24px}
.ind-bar{display:block;height:3px;border-radius:2px;background:var(--c2);margin-top:5px;overflow:hidden;position:relative}
.ind-bar .fill{display:block;height:100%;border-radius:2px}
.ind-lbl.safe{color:var(--g)}.ind-lbl.neutral{color:var(--b)}
.ind-lbl.elevated{color:var(--y)}.ind-lbl.crisis{color:var(--r)}

/* Deployment signal */
.deploy-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.deploy-card{background:rgba(255,255,255,0.015);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.deploy-lbl{font:600 9.5px var(--s);color:var(--t2)}
.deploy-pct{font:700 22px var(--m);letter-spacing:-.03em;margin-top:1px}
.deploy-status{font:600 9.5px var(--s);letter-spacing:.02em;margin-top:1px}
.deploy-bar{height:5px;background:var(--c2);border-radius:3px;margin-top:7px;overflow:hidden}
.deploy-bar .fill{height:100%;border-radius:3px}
.deploy-sub{font:400 9px var(--m);color:var(--t4);margin-top:4px}

/* Regime timeline */
.timeline-wrap{position:relative;height:170px}

/* Slim header (compact regime number sits in the gauge card now) */
.hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.hd2 h1{font:700 13px var(--m);color:var(--t2);letter-spacing:.08em}
.hd2-sub{font:400 10px var(--m);color:var(--t4)}

/* Footer */
.ft{margin-top:24px;padding:14px;background:var(--c1);border:1px solid var(--bd);border-radius:6px;font:400 9.5px var(--m);color:var(--t4);line-height:1.8}
.ft .k{color:var(--t3);font-weight:700;letter-spacing:.1em}
.ld{text-align:center;padding:80px;font:500 12px var(--m);color:var(--t3)}

@media(max-width:820px){
  .w{padding:14px 10px 40px}
  .td-grid,.tk-grid,.tk-grid2{grid-template-columns:1fr}
  .fund-grid{grid-template-columns:repeat(2,1fr)}
  .corr-row{grid-template-columns:repeat(2,1fr)}
  .tk-rets{grid-template-columns:repeat(3,1fr)}
  table{font-size:10px}
  th,td{padding:6px 8px}
  .rcc-top{grid-template-columns:1fr}
  .ind-grid{grid-template-columns:repeat(2,1fr)}
  .deploy-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="w" id="app"><div class="ld">Loading tournament data…</div></div>
<script>
"use strict";
const S = {tournament:null, backtest:null, holdings:null, config:null, tickers:null, metrics:null,
           regime:null, regimeDaily:null,
           period:"ALL", expanded:null, expandedTicker:null,
           chart:null, tickerChart:null, regimeChart:null, tickerChartPeriod:"6M"};

const fmt   = n => (typeof n === "number") ? n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}) : "—";
const fmt2  = n => (typeof n === "number") ? n.toFixed(2) : "—";
const fmtP  = n => (typeof n === "number") ? ((n>=0?"+":"") + n.toFixed(2) + "%") : "—";
const fmtP1 = n => (typeof n === "number") ? ((n>=0?"+":"") + n.toFixed(1) + "%") : "—";
const pnlc  = n => (n>0 ? "pos" : (n<0 ? "neg" : "neut"));

const TIER_ORDER = ["1_cap_pres","2_balanced","3_aggressive","4_tactical","5_werner"];
const BENCH_FOR_TIER = {"1_cap_pres":"60_40", "2_balanced":"spy", "3_aggressive":"qqq", "4_tactical":"sso", "5_werner":"spy"};

function tierSpec(tid){ if (tid === "5_werner") return S.config.werner_picks; return (S.config.tier_specs || {})[tid]; }
function regimeLabel(R){ return R<0.3?"Low risk":R<0.5?"Elevated":R<0.7?"High risk":"Crisis"; }
function regimeColor(R){ return R<0.3?"var(--g)":R<0.5?"var(--y)":R<0.7?"var(--o)":"var(--r)"; }
function regimeHex(R){ return R<0.3?"#4ade80":R<0.5?"#facc15":R<0.7?"#fb923c":"#f87171"; }
function statusHex(s){ return ({safe:"#4ade80",neutral:"#60a5fa",elevated:"#facc15",crisis:"#f87171"})[s] || "#737373"; }
function statusLabel(s){ return ({safe:"Safe",neutral:"Neutral",elevated:"Caution",crisis:"Crisis"})[s] || s; }

// SVG semicircle gauge: 0 → 1 mapped to -90° → +90°.
// Returns inline SVG markup.
function gaugeSVG(R){
  if (R == null) R = 0;
  const cx = 110, cy = 110, r = 90, arc_w = 18;
  // Build 4 colored arcs over [-90°, +90°] (i.e. top half)
  const segs = [
    {from:0.00, to:0.30, color:"#4ade80"}, // safe
    {from:0.30, to:0.50, color:"#facc15"}, // elevated
    {from:0.50, to:0.70, color:"#fb923c"}, // high
    {from:0.70, to:1.00, color:"#f87171"}, // crisis
  ];
  const toXY = t => {
    // t ∈ [0,1] → angle ∈ [180°, 360°] in standard math coords (top semicircle)
    const ang = Math.PI * (1 + t);
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const arcs = segs.map(s => {
    const [x0,y0] = toXY(s.from);
    const [x1,y1] = toXY(s.to);
    const large = (s.to - s.from) > 0.5 ? 1 : 0;
    return `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"
                  fill="none" stroke="${s.color}" stroke-width="${arc_w}" stroke-linecap="butt"/>`;
  }).join("");
  // Needle
  const [nx, ny] = toXY(Math.max(0, Math.min(1, R)));
  const needle = `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}"
                       stroke="#d4d4d4" stroke-width="3" stroke-linecap="round"/>
                  <circle cx="${cx}" cy="${cy}" r="6" fill="#d4d4d4"/>`;
  // Labels
  const labels = `<text x="14" y="135" font-family="IBM Plex Mono" font-size="10" fill="#737373">safe</text>
                  <text x="186" y="135" font-family="IBM Plex Mono" font-size="10" fill="#737373" text-anchor="end">danger</text>`;
  return `<svg class="gauge-svg" viewBox="0 0 220 145" xmlns="http://www.w3.org/2000/svg">
            ${arcs}${needle}${labels}
          </svg>`;
}

// Apply a 1Y / 2Y / 5Y / ALL window to a [{d, v}] series
function indFilterPeriod(arr, period){
  if (!arr || !arr.length || period === "ALL") return arr;
  const last = new Date(arr[arr.length-1].d);
  const start = new Date(last);
  switch(period){
    case "1Y": start.setFullYear(start.getFullYear()-1); break;
    case "2Y": start.setFullYear(start.getFullYear()-2); break;
    case "5Y": start.setFullYear(start.getFullYear()-5); break;
  }
  return arr.filter(p => new Date(p.d) >= start);
}

function renderDeployment(R){
  return `<div class="deploy-grid">${TIER_ORDER.map(tid => {

    const cashFloor = sp.cash_floor ?? 0;
    const cashSlope = sp.cash_slope ?? 0.7;
    const cashMax   = sp.cash_max   ?? 1.0;
    const cashPct   = R != null ? Math.max(cashFloor, Math.min(cashMax, cashFloor + R * cashSlope)) : cashFloor;

    return `<div class="deploy-card">
      <div class="deploy-lbl" style="color:${sp.color}">${sp.short}</div>
      <div class="deploy-pct" style="color:${sp.color}">${deployPct.toFixed(0)}%</div>

// -------- Build unified series per tier (backtest + live, rebased at seam) --------
function buildSeries(){
  const series = {};                   // tier_id → [{date, nav}]
  const benchSeries = {spy:[], qqq:[], "60_40":[], sso:[]};

  if (S.backtest && S.backtest.rows) {
    const rows = S.backtest.rows;
    TIER_ORDER.forEach(tid => {
      series[tid] = rows.filter(r => r[tid] != null && !isNaN(r[tid]))
                        .map(r => ({date:r.date, nav:+r[tid]}));
    });
    Object.keys(benchSeries).forEach(b => {
      benchSeries[b] = rows.filter(r => r[b] != null && !isNaN(r[b]))
                            .map(r => ({date:r.date, nav:+r[b]}));
    });
  }

  if (S.tournament && S.tournament.history && S.tournament.history.length > 0) {
    TIER_ORDER.forEach(tid => {
      const liveDays = S.tournament.history.filter(h => h.tiers && h.tiers[tid] && h.tiers[tid].nav > 0);
      if (liveDays.length === 0) return;
      series[tid] = series[tid] || [];
      const btDates = new Set(series[tid].map(r => r.date));
      const btLastDate = series[tid].length > 0 ? series[tid][series[tid].length-1].date : null;
      // Find a live entry whose date OVERLAPS with backtest — use that pair for rebasing
      // so that live[seam] · k = backtest[seam].
      let k = 1.0;
      if (tid !== "5_werner") {
        const overlap = liveDays.find(d => btDates.has(d.date));
        if (overlap) {
          const btMatch = series[tid].find(r => r.date === overlap.date);
          if (btMatch && overlap.tiers[tid].nav > 0) k = btMatch.nav / overlap.tiers[tid].nav;
        } else if (series[tid].length > 0) {
          // No overlap — fall back to ratio of last backtest vs first live
          k = series[tid][series[tid].length-1].nav / liveDays[0].tiers[tid].nav;
        }
      }
      // Append ONLY live entries whose date is strictly AFTER the backtest endpoint.
      liveDays.forEach(d => {
        if (!btLastDate || d.date > btLastDate) {
          series[tid].push({date:d.date, nav:d.tiers[tid].nav * k, live:true});
        }
      });
      series[tid].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    });
    // Benchmarks: same rules
    Object.keys(benchSeries).forEach(b => {
      const live = S.tournament.history
        .filter(h => h.benchmarks && h.benchmarks[b] && h.benchmarks[b].nav != null)
        .map(h => ({date:h.date, nav:h.benchmarks[b].nav}));
      if (live.length === 0) return;
      const btDates = new Set(benchSeries[b].map(r => r.date));
      const btLastDate = benchSeries[b].length > 0 ? benchSeries[b][benchSeries[b].length-1].date : null;
      let k = 1.0;
      const overlap = live.find(d => btDates.has(d.date));
      if (overlap) {
        const btMatch = benchSeries[b].find(r => r.date === overlap.date);
        if (btMatch && overlap.nav > 0) k = btMatch.nav / overlap.nav;
      } else if (benchSeries[b].length > 0) {
        k = benchSeries[b][benchSeries[b].length-1].nav / live[0].nav;
      }
      live.forEach(d => {
        if (!btLastDate || d.date > btLastDate) benchSeries[b].push({date:d.date, nav:d.nav * k});
      });
      benchSeries[b].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    });
  }
  return {tiers:series, bench:benchSeries};
}

function applyPeriod(series, period){
  if (!series.length) return series;
  if (period === "ALL") return series;
  const lastDate = new Date(series[series.length-1].date);
  let start = new Date(lastDate);
  switch(period){
    case "1M": start.setMonth(start.getMonth()-1); break;
    case "3M": start.setMonth(start.getMonth()-3); break;
    case "6M": start.setMonth(start.getMonth()-6); break;
    case "YTD": start = new Date(lastDate.getFullYear(), 0, 1); break;
    case "1Y": start.setFullYear(start.getFullYear()-1); break;
    case "5Y": start.setFullYear(start.getFullYear()-5); break;
    default: return series;
  }
  return series.filter(r => new Date(r.date) >= start);
}

function rebase(series){
  if (!series.length) return series;
  const base = series[0].nav;
  return series.map(r => ({...r, nav: r.nav / base}));
}

function tierMetrics(series, benchSeries){
  if (!series || series.length < 2) return null;
  const first = series[0].nav, last = series[series.length-1].nav;
  const total = (last/first - 1) * 100;
  const lastDate = new Date(series[series.length-1].date);
  const wAgo = new Date(lastDate); wAgo.setDate(wAgo.getDate()-7);
  const mAgo = new Date(lastDate); mAgo.setMonth(mAgo.getMonth()-1);
  const findPrior = d => { for (let i = series.length-1; i >= 0; i--) if (new Date(series[i].date) <= d) return series[i].nav; return null; };
  const w1 = (() => { const p = findPrior(wAgo); return p ? (last/p - 1) * 100 : null; })();
  const m1 = (() => { const p = findPrior(mAgo); return p ? (last/p - 1) * 100 : null; })();

  const rets = [];
  let runMax = first, maxDD = 0;
  for (let i = 1; i < series.length; i++){
    rets.push(series[i].nav / series[i-1].nav - 1);
    runMax = Math.max(runMax, series[i].nav);
    maxDD  = Math.min(maxDD, series[i].nav / runMax - 1);
  }
  const mean = rets.reduce((a,b)=>a+b,0) / rets.length;
  const sd = Math.sqrt(rets.reduce((s,r)=>s+(r-mean)**2,0) / rets.length);
  const sharpe = sd > 0 ? (mean * 252) / (sd * Math.sqrt(252)) : 0;

  let alpha = null;
  if (benchSeries && benchSeries.length >= 2){
    const bRet = (benchSeries[benchSeries.length-1].nav / benchSeries[0].nav - 1) * 100;
    alpha = total - bRet;
  }
  return {total, w1, m1, sharpe, maxDD:maxDD*100, alpha};
}

        <div class="tier-desc">${(t.description||"").substring(0,80)}${(t.description||"").length>80?"…":""}</div>
      </td>
      <td class="num">${navVal ? "$"+fmt(navVal) : "—"}</td>
      <td class="num ${pnlc(m.total)}">${fmtP(m.total)}</td>
      <td class="num ${m.m1!=null?pnlc(m.m1):'neut'}">${m.m1!=null?fmtP1(m.m1):"—"}</td>
      <td class="num ${m.w1!=null?pnlc(m.w1):'neut'}">${m.w1!=null?fmtP1(m.w1):"—"}</td>
      <td class="num">${m.sharpe.toFixed(2)}</td>
      <td class="num neg">${fmtP1(m.maxDD)}</td>
      <td class="num ${m.alpha!=null?pnlc(m.alpha):'neut'}">${m.alpha!=null?fmtP1(m.alpha):"—"}</td>
      <td class="num">${nPos != null ? nPos : "—"}</td>
      <td><span class="chev ${open?"open":""}">›</span></td>
    </tr>`;
    if (open) {
      h += `<tr><td colspan="11" style="padding:0"><div class="tier-detail open">${renderTierDetail(tid)}</div></td></tr>`;
    }
  });
  h += `</table></div>`;

  // ---- Footer ----
  h += `<div class="ft">
    <span class="k">SCORING </span>4-factor cross-sectional model: technical (MA200 dist, RSI, 6m relative strength) + fundamental (Fwd P/E, rev growth, gross/op margins, ROE). Tier 3/4 double-weight 6m RS.<br>
    <span class="k">SELECTION </span>Monthly. Each tier picks top-N from its filtered universe — Tier 1 restricted to defensive sectors with GM>30% and FCF>0; Tiers 2-4 use the full universe.<br>
    <span class="k">REGIME </span>R<sub>t</sub> from 12 risk indicators z-scored over 252 days, mapped via Φ, equal-weight mean. Sizes cash sleeve per tier formula.<br>
    <span class="k">TIER 5 (WERNER) </span>Manual picks from config.json. Not backtested (no discretionary history). Updated when Werner trades.<br>
    <span class="k">DATA </span>Yahoo + FRED. Updated weekdays 6 pm ET (daily NAV) and 1st of month 10 am ET (rescore + reselect).
  </div>`;

  a.innerHTML = h;

  // ---- Bindings ----
  document.querySelectorAll(".period-btn[data-p]").forEach(b => b.addEventListener("click", () => {
    S.period = b.dataset.p; render();
  }));
  document.querySelectorAll(".tier-row").forEach(r => r.addEventListener("click", (ev) => {
    if (ev.target.closest(".tk-row") || ev.target.closest(".tk-detail")) return;
    const tid = r.dataset.tid;
    S.expanded = (S.expanded === tid) ? null : tid;
    if (S.expanded !== tid) S.expandedTicker = null;
    render();
  }));
  document.querySelectorAll(".tk-row").forEach(r => r.addEventListener("click", (ev) => {
    if (ev.target.closest(".tk-detail")) return;
    ev.stopPropagation();
    const tk = r.dataset.tk;
    S.expandedTicker = (S.expandedTicker === tk) ? null : tk;
    render();
  }));
  document.querySelectorAll("[data-close-tk]").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    S.expandedTicker = null;
    render();
  }));
  document.querySelectorAll(".period-btn[data-tkp]").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    S.tickerChartPeriod = b.dataset.tkp;
    render();
  }));
  // ---- Indicator card clicks (open / close drill-down) ----
  document.querySelectorAll(".ind-card[data-ind]").forEach(c => c.addEventListener("click", (ev) => {
    if (ev.target.closest(".ind-detail")) return;
    const k = c.dataset.ind;
    S.expandedIndicator = (S.expandedIndicator === k) ? null : k;
    render();
  }));
  document.querySelectorAll("[data-close-ind]").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    S.expandedIndicator = null;
    render();
  }));
  document.querySelectorAll(".id-period-btn[data-indp]").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    S.indPeriod = b.dataset.indp;
    render();
  }));
  // Draw charts after DOM
  setTimeout(() => {
    renderRegimeTimeline();
    renderChart(allSeries, S.period);
    if (S.expandedTicker) renderTickerChart(S.expandedTicker);
    if (S.expandedIndicator) renderIndicatorCharts();
  }, 10);
}

async function loadJSON(path){ try { const r = await fetch(path + "?" + Date.now()); if (r.ok) return await r.json(); } catch(e){} return null; }
async function loadCSV(path){
  try { const r = await fetch(path + "?" + Date.now()); if (!r.ok) return null;
    return Papa.parse(await r.text(), {header:true, dynamicTyping:true, skipEmptyLines:true}).data;
  } catch(e){ return null; }
}

async function init(){
  S.config     = await loadJSON("config.json");
  S.tournament = await loadJSON("data/tournament.json");
  S.holdings   = await loadJSON("data/tier_holdings.json");
  S.tickers    = await loadJSON("data/ticker_indicators.json");
  S.metrics    = await loadJSON("data/backtest_metrics.json");
  S.regime     = await loadJSON("data/regime_indicators.json");
  S.regimeDaily = await loadCSV("data/regime_daily.csv");
  S.indicatorSeries = await loadJSON("data/indicator_series.json");
  const rows   = await loadCSV("data/backtest_equity_curves.csv");
  S.backtest   = rows ? {rows} : null;

  if (!S.config) {
    document.getElementById("app").innerHTML = '<div class="ld">config.json not found</div>';
    return;
  }
  if (!S.tournament && !S.backtest) {
    document.getElementById("app").innerHTML = `<div class="ld">No tournament data yet.</div>`;
    return;
  }
  render();
}
init();
</script>
</body></html>
