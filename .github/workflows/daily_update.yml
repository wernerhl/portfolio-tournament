name: Daily Update

on:
  schedule:
    # CLOSE run — the authoritative daily update: full pipeline (settled
    # regime, NAV, signals, thesis, v4, published vintage). 22:00 UTC ≈ 6pm ET,
    # safely after the 4pm close in BOTH DST regimes with buffer for EOD bars
    # to settle. Earlier risks a partial bar that the no-look-ahead guard
    # rejects (→ reproduces yesterday). Morning refresh = market_open.yml;
    # all-day shock watch = intraday.yml.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # order item 4.3: signal_alerts.py opens/closes labelled issues with the job token

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance fredapi pandas numpy scipy pyarrow

      - name: Run daily pipeline
        id: pipeline
        # [5] continue-on-error: a validation rejection still publishes
        # data/status.json (failure_reason) while served artifacts keep their
        # last good state; the job is re-failed in the propagate step.
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_daily.py

      - name: Nightly audit sweep (order item 6)
        id: audit
        # After the pipeline, before commit/deploy. CRITICAL: served files are
        # restored to the last good commit, status.json names the checks, this
        # step fails (the job fails in the propagate step) — the deploy then
        # publishes the last good board + the new status.json so the dashboard
        # shows the rejection. HIGH: logged in status.json.audit.high and
        # surfaced in the dashboard status strip; never blocks.
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/wernerhl/portfolio-screener.git ../portfolio-screener
          mkdir -p reports
          set +e
          python scripts/audit_nightly.py data ../portfolio-screener/data > reports/audit_last.txt 2>&1
          rc=$?
          set -e
          cat reports/audit_last.txt
          python scripts/audit_status.py reports/audit_last.txt --status data/status.json --restore-dir data --scope tournament
          exit $rc

      - name: Commit
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/ reports/audit_last.txt
          git diff --cached --quiet || git commit -m "📊 $(date -u +%Y-%m-%d)"
          git pull --rebase --strategy-option=ours origin main || true
          git push

      - name: Signal alerts (order item 4.3)
        # Post-publish: compares the served state just committed with
        # data/alert_state.json and opens / closes ONE labelled issue per event
        # type (regime band crossing with hysteresis, shock, complacency active
        # or impaired) through gh with the job token — no extra secret, no
        # external service. First run only records state. Never fails the
        # nightly: every command is guarded. The state file is committed on its
        # own so a failed alert step cannot touch the data commit above.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/signal_alerts.py --write-state || true
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          if git add data/alert_state.json 2>/dev/null && ! git diff --cached --quiet; then
            git commit -m "🔔 alert state $(date -u +%Y-%m-%d)" \
              && git pull --rebase --strategy-option=ours origin main \
              && git push \
              || echo "::warning::alert state commit/push failed (non-fatal)"
          fi

      - name: Propagate pipeline failure
        if: steps.pipeline.outcome == 'failure' || steps.audit.outcome == 'failure'
        run: |
          echo "pipeline rejected or audit CRITICAL — served artifacts preserved (last good), status.json published with the check names"
          exit 1

  deploy:
    # Shared Pages-deploy concurrency guard (see intraday.yml for the full
    # rationale): serialize the three overlapping Pages deployers so they no
    # longer collide and briefly 404 the live site.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: update
    # [5] deploy even on rejection: main carries preserved artifacts + the new
    # status.json so the dashboard can surface the failure.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
