name: Daily Update

on:
  schedule:
    # CLOSE run — the authoritative daily update: full pipeline (settled
    # regime, NAV, signals, thesis, v4, published vintage). 22:00 UTC ≈ 6pm ET,
    # safely after the 4pm close in BOTH DST regimes with buffer for EOD bars
    # to settle. Earlier risks a partial bar that the no-look-ahead guard
    # rejects (→ reproduces yesterday). Morning refresh = market_open.yml;
    # all-day shock watch = intraday.yml.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance fredapi pandas numpy scipy pyarrow

      - name: Run daily pipeline
        id: pipeline
        # [5] continue-on-error: a validation rejection still publishes
        # data/status.json (failure_reason) while served artifacts keep their
        # last good state; the job is re-failed in the propagate step.
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_daily.py

      - name: Commit
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/
          git diff --cached --quiet || git commit -m "📊 $(date -u +%Y-%m-%d)"
          git pull --rebase --strategy-option=ours origin main || true
          git push

      - name: Propagate pipeline failure
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "pipeline was rejected — served artifacts preserved, status.json published"
          exit 1

  deploy:
    # Shared Pages-deploy concurrency guard (see intraday.yml for the full
    # rationale): serialize the three overlapping Pages deployers so they no
    # longer collide and briefly 404 the live site.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: update
    # [5] deploy even on rejection: main carries preserved artifacts + the new
    # status.json so the dashboard can surface the failure.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
