name: Monthly Rebalance
run-name: "Monthly Rebalance · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.trigger || github.event_name }}"

on:
  schedule:
    - cron: '0 14 1 * *'   # 1st of month, 10am ET (≈14:00 UTC)
  workflow_dispatch:
    inputs:
      trigger:
        description: "who dispatched (the run-name shows it; H2, 7-Oct-2026: the expression needs a declared input)"
        required: false
        default: manual

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance fredapi pandas numpy scipy pyarrow scikit-learn

      - name: Re-score + reselect tiers + rebuild ticker data + recompute signals
        run: |
          python scripts/score_universe.py
          python scripts/select_tiers.py
          python scripts/build_ticker_data.py
          python scripts/compute_signals.py
          python scripts/regime_v4_ml.py   # monthly v4 recalibration (writes v4_scoring_params.json knots)
          python scripts/compute_thesis_backtest.py   # B5: thesis attribution over full backtest

      - name: Monthly review (audit order 30-Sept, section 5 / T7 — the month just ended, from the ledgers; generated once, never edited)
        continue-on-error: true
        run: python scripts/monthly_review.py || [ $? -eq 2 ]   # 2 = a review for that month already exists; nothing written

      - name: Commit
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/ reports/reviews/
          git diff --cached --quiet || git commit -m "🔄 Rebalance $(date -u +%Y-%m)"
          git pull --rebase --strategy-option=ours origin main || true
          git push
