name: Intraday analytics
run-name: "Intraday analytics · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.trigger || github.event_name }}"

# Every 2 hours during US market hours, recompute the price-dependent panels on the LIVE
# tape and deploy: the book (position values, NAV, stress dollars, return-vs-cost) and the
# bonds book-integration (the conditional message, the whole-portfolio stress). Stamped
# "intraday" with the fetch time.
#
# What this job does NOT touch (the settled record is left to the nightly):
#   * the settled daily-close price store (prices are overlaid in memory only);
#   * scores, cost basis, the regime/tournament vintages, the referee, the FRED fetch;
#   * the 126-session risk windows (vol, beta, risk share, correlation) — those stay on the
#     last settled close; only the current price used for market value comes from the tape.
# Only data/book.json and data/bonds/{states,sleeve_metrics}.json are rewritten and pushed.
# The nightly overwrites all three with the settled close each evening.

on:
  schedule:
    - cron: '0 14,16,18,20 * * 1-5'   # 10:00, 12:00, 14:00, 16:00 ET — every 2 hours over the session
  workflow_dispatch:
    inputs:
      trigger:
        description: "who dispatched (the external scheduler writes 'external HH:MM ET')"
        required: false
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read     # the backup-cron gate reads this workflow's run history

jobs:
  # 5-Oct-2026 order, 2.7: the external scheduler dispatches this workflow (docs/scheduling.md); a GitHub
  # cron run is a backup and proceeds only when no successful run already covers its slot.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ops
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ops/backup_cron_gate.py --workflow intraday_analytics.yml --within-min 100

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy pyarrow scipy

      - name: Trading day?
        id: gate
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, 'scripts')
          from trading_calendar import now_et, is_trading_day
          d = now_et().strftime('%Y-%m-%d')
          print(f"go={'true' if is_trading_day(d) else 'false'}")
          EOF

      - name: Recompute on the live tape (book + bonds book-integration)
        if: steps.gate.outputs.go == 'true'
        # No FRED key: the bonds states read the committed FRED store; only the equity/sleeve
        # tape is fetched. A failure of any step keeps the last good served file.
        continue-on-error: true
        env:
          # 1-Oct-2026: the SEC's declared contact, so the two-hourly news window keeps the EDGAR filings
          # the nightly found (without it the source is skipped and its items drop out between nightlies)
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/compute_book.py --intraday
          python scripts/bonds/build_sleeve_metrics.py --intraday
          python scripts/bonds/compute_bonds.py --intraday
          python scripts/compute_goals.py --intraday          # D1 (order 30-Sept): the house goal at the live USDBRL rate
          python scripts/fetch_news.py                        # B4 (order 30-Sept): the news panel's 24-hour window, every 2 hours

      - name: Commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/book.json data/bonds/states.json data/bonds/sleeve_metrics.json data/goals.json data/news.json
          git diff --cached --quiet || git commit -m "📈 intraday analytics $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --strategy-option=ours origin main || true
          git push

  deploy:
    # Shared Pages-deploy concurrency guard: serialize the overlapping deployers (nightly,
    # intraday, market-open, this job) so they never collide and 404 the live site.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: [gate, refresh]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # F3 (7-Oct-2026): a deploy takes about a minute; a stuck one must not hold the queue
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Parse-check the front-end scripts (1-Oct-2026 — a broken script must never deploy; the last good site stays)
        run: for f in app.js common.js pages.js charts.js screen.js; do node --check "$f" || { echo "::error::$f does not parse"; exit 1; }; done
      - name: Keep the research folder out of the site (F5, 7-Oct-2026)
        run: rm -rf research
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
