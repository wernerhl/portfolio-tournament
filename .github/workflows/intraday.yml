name: Intraday Refresh

on:
  schedule:
    # Every 30 min, 9:30am–4pm ET. UTC range 13–21 covers both EST and EDT.
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance numpy pandas

      - name: Run intraday snapshot
        run: python scripts/compute_intraday.py

      - name: Commit
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/intraday.json
          git diff --cached --quiet || git commit -m "⏱ intraday $(date -u +%H:%M)"
          git pull --rebase --strategy-option=ours || true
          git push

  deploy:
    needs: intraday
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
