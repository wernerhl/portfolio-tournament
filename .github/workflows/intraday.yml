name: Intraday Refresh
run-name: "Intraday Refresh · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.trigger || github.event_name }}"

on:
  schedule:
    # Every 30 min, 9:30am–4pm ET. UTC range 13–21 covers both EST and EDT.
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      trigger:
        description: "who dispatched (the external scheduler writes 'external HH:MM ET')"
        required: false
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write    # the backup-cron gate reads this workflow's run history; F3: the deploy watchdog cancels stuck deploy jobs

jobs:
  # 5-Oct-2026 order, 2.7: the external scheduler dispatches this workflow (docs/scheduling.md); a GitHub
  # cron run is a backup and proceeds only when no successful run already covers its slot.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ops
      - name: Deploy watchdog (F3, 7-Oct-2026 — cancel deploy jobs stuck for more than 30 minutes before anything else)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ops/deploy_watchdog.py --max-age-min 30 || true
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ops/backup_cron_gate.py --workflow intraday.yml --within-min 25

  intraday:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance numpy pandas

      - name: Run intraday snapshot
        run: python scripts/compute_intraday.py

      - name: Commit
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/intraday.json
          git diff --cached --quiet || git commit -m "⏱ intraday $(date -u +%H:%M)"
          git pull --rebase --strategy-option=ours || true
          git push

  deploy:
    # GitHub Pages allows ONE deployment to the environment at a time. Three
    # workflows here (daily_update / market_open / intraday) deploy this repo's
    # Pages and overlap during market hours — without this guard the concurrent
    # deploy-pages calls collided: one job failed and the live swap could
    # briefly 404 (the intermittent "site not working"). A shared group across
    # all three serializes them; cancel-in-progress:false lets an in-flight
    # deploy finish cleanly instead of tearing down mid-swap. Newest queued
    # deploy still wins the single pending slot, so data stays fresh.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: intraday
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # F3 (7-Oct-2026): a deploy takes about a minute; a stuck one must not hold the queue
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Parse-check the front-end scripts (1-Oct-2026 — a broken script must never deploy; the last good site stays)
        run: for f in app.js common.js pages.js charts.js screen.js; do node --check "$f" || { echo "::error::$f does not parse"; exit 1; }; done
      - name: Keep the research folder out of the site (F5, 7-Oct-2026)
        run: rm -rf research
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
