name: Vintage Rebuild (ALFRED point-in-time inputs)

# Order 9-Sept C2: fetch ALL releases of every FRED series the v2 regime index
# uses and build point-in-time inputs (what was known on each day). Needs the
# FRED_API_KEY secret, so it runs here, on demand. Writes SOURCE data only
# (data/source/*_pit.parquet + vintage meta); nothing served, no deploy.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vintages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install fredapi pandas numpy pyarrow
      - name: Build point-in-time inputs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fred_vintages.py --allow-non-trading
      - name: Commit source artifacts
        run: |
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/source/fred_indicators_pit.parquet data/source/fred_derived_pit.parquet data/source/fred_vintage_meta.json
          git diff --cached --quiet || git commit -m "🗂 ALFRED point-in-time inputs $(date -u +%Y-%m-%d)"
          git pull --rebase --strategy-option=ours origin main || true
          git push
