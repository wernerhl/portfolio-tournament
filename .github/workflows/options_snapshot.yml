name: Options snapshot (15:45 ET)
run-name: "Options snapshot · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.trigger || github.event_name }}"

# Order 26-Sept-2026, item 1.2: the daily option-chain vintage, pulled ONCE at about 15:45 ET on
# trading days for every held name, the screen board's top 40 and SPY/QQQ/SMH, written
# immutably to data/options/vintages/YYYY-MM-DD/. After-hours pulls are prohibited, so the
# snapshot step only writes inside 15:30–16:00 ET on a trading day.
#
# GitHub delivers this repository's scheduled runs minutes to hours late, or never (28/29-Sept and
# 5-Oct: no cron arrived before the window). The primary trigger is therefore external
# (docs/scheduling.md): dispatches at 15:40, 15:46 and 15:52 ET pull at once. The two backup crons
# sleep until 15:49 ET when they land early (after the 15:40 dispatch has normally pushed).
#
# One writer per day, without a concurrency queue (5-Oct order, 2.2): GitHub keeps ONE pending run
# per concurrency group and cancels the others, so the old group cancelled runs and mailed about it.
# snapshot_chains.py --publish fetches origin/main first and exits "already written" if today's
# vintage is there; it pulls into a temporary folder, moves it into place and pushes; if the push
# is rejected because another run pushed first, it discards its vintage and does not retry.
#
# Source data only: the nightly computes lens.json from the vintage and deploys.

on:
  # 5-Oct-2026 order, 2.1: the primary trigger is external. A Cloudflare Worker dispatches this
  # workflow at 15:40, 15:46 and 15:52 ET on weekdays (scheduler/worker, docs/scheduling.md).
  # Two GitHub crons remain as a backup; they sleep until the window when they land early.
  schedule:
    - cron: '0 13 * * 1-5'    # 09:00 EDT / 08:00 EST: useful only when delivered >= ~1.2 h late (the sleep cap is 5.6 h)
    - cron: '0 17 * * 1-5'    # 13:00 EDT / 12:00 EST
  workflow_dispatch:
    inputs:
      trigger:
        description: "who dispatched (the external scheduler writes 'external HH:MM ET')"
        required: false
        default: manual

permissions:
  contents: write
  issues: write     # 2.4: closes the missed-snapshot issue once a later day's vintage is written

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy scipy pyarrow lxml

      - name: Wait for the window (backup crons only; a dispatch pulls at once)
        id: wait
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, sys, time
          sys.path.insert(0, "scripts")
          from trading_calendar import now_et, is_trading_day
          n = now_et()
          if not is_trading_day(n.strftime("%Y-%m-%d")):
              print("go=false"); print(f"why=market closed ({n:%Y-%m-%d})"); sys.exit(0)
          if os.environ.get("EVENT") != "schedule":
              print("go=true"); print(f"why=dispatched, {n:%H:%M} ET (the snapshot step enforces the 15:30–16:00 window)"); sys.exit(0)
          target = n.replace(hour=15, minute=49, second=0, microsecond=0)
          wait = (target - n).total_seconds()
          if wait > 5.6 * 3600:
              print("go=false"); print(f"why=landed {wait/3600:.1f} h before the pull time, beyond the sleep cap"); sys.exit(0)
          if wait > 0:
              print(f"::notice::backup cron landed {n:%H:%M} ET; sleeping {wait/60:.0f} min until 15:49 ET", file=sys.stderr)
              time.sleep(wait)
          print("go=true"); print(f"why=backup cron at {now_et():%H:%M} ET")
          EOF
      - name: Report
        run: echo "go=${{ steps.wait.outputs.go }} — ${{ steps.wait.outputs.why }}"

      - name: Snapshot chains (one writer per day; writes only inside 15:30–16:00 ET; commits and pushes itself)
        id: snap
        if: steps.wait.outputs.go == 'true'
        env:
          SNAPSHOT_TRIGGER: ${{ github.event_name == 'schedule' && format('backup cron {0}', github.event.schedule) || inputs.trigger || github.event_name }}
        run: python scripts/options/snapshot_chains.py --publish

      - name: Close the missed-snapshot issue (a later day's vintage now exists)
        if: steps.snap.outputs.outcome == 'written'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/options/snapshot_alerts.py sync --close-only

      - name: Earnings dates and reaction history (weekly refresh per name; only after this run wrote the vintage)
        if: steps.snap.outputs.outcome == 'written'
        continue-on-error: true
        run: |
          python scripts/options/build_earnings_reactions.py
          git config user.name "Tournament Bot"
          git config user.email "bot@tournament"
          git add data/options/earnings_reactions.json
          git diff --cached --quiet && exit 0
          git commit -m "🧾 earnings reactions $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep $((i * 3)); done
          exit 1
