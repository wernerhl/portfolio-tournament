# Cloudflare Worker: dispatches the repository's time-window workflows at fixed Eastern times.
# Deploy and secrets: docs/scheduling.md. The token is a Worker secret (wrangler secret put GH_TOKEN),
# never a [vars] entry and never committed.
name = "portfolio-tournament-scheduler"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
# UTC. Wakes on every minute any route can fall on, Monday-Friday, 13:00-21:59 UTC (09:00-17:59 EDT,
# 08:00-16:59 EST); src/index.js converts to Eastern time and dispatches only the routes due.
crons = ["0,5,30,40,46,52 13-21 * * mon-fri"]

[vars]
# "YYYY-MM-DD" to dispatch the 15:40 options run twice on that date (acceptance test 2); empty otherwise.
DOUBLE_DISPATCH_ON = ""
# "YYYY-MM-DD" to open a [TEST] missed-snapshot issue at that day's 16:05 ET check (acceptance test 5); empty otherwise.
FORCE_MISS_ON = ""
